<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#6366f1"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SpesaTracker"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="./icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"/>
<title>💰 SpesaTracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0f1e;--bg2:#0f172a;--card:#1e293b;--card2:#263447;--inp:#0f172a;
--brd:#334155;--brd2:#1e293b;--t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;
--acc:#6366f1;--accl:#818cf8;--accb:#6366f120;
--grn:#10b981;--red:#ef4444;--redb:#ef444420;--yel:#f59e0b;
--r:16px;--rs:10px;--rx:8px;--nav:70px;--tr:0.2s ease
}
html{font-size:16px;height:100%}
body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
line-height:1.5;overflow-x:hidden;min-height:100vh;min-height:100dvh}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;font-size:inherit;line-height:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* LAYOUT */
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto}
.scroll{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav) + 20px);scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pag{padding:20px 16px;display:flex;flex-direction:column;gap:14px}

/* CARD */
.card{background:var(--card);border-radius:var(--r);padding:18px;border:1px solid var(--brd2)}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
height:var(--nav);background:var(--card);border-top:1px solid var(--brd);
display:flex;align-items:center;justify-content:space-around;padding:0 4px;
padding-bottom:env(safe-area-inset-bottom,0);z-index:100}
.nbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;
border-radius:var(--rs);color:var(--t3);transition:all var(--tr);min-width:56px;flex:1}
.nbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;
stroke-linecap:round;stroke-linejoin:round}
.nbtn span{font-size:0.65rem;font-weight:600;letter-spacing:0.02em}
.nbtn.on{color:var(--accl);background:var(--accb)}

/* TITOLO */
.titpag{font-size:1.4rem;font-weight:700;letter-spacing:-0.02em}

/* NAV MESE */
.navmese{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.infomese{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:0.88rem;font-weight:500}
.infomese svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bdgcorr{background:var(--accb);color:var(--accl);font-size:0.6rem;padding:2px 8px;border-radius:100px;font-weight:700}
.bfrec{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
border-radius:50%;font-size:1.5rem;color:var(--t2);background:var(--inp);line-height:1}
.bfrec:disabled{opacity:0.25;cursor:not-allowed}

/* CARD TOTALE */
.ctot{text-align:center;padding:28px 20px;
background:linear-gradient(135deg,#1e293b,#0f172a);
border:1px solid var(--accb);position:relative;overflow:hidden}
.ctot::before{content:'';position:absolute;inset:-50%;
background:radial-gradient(circle at center,#6366f108,transparent 60%)}
.ltot{font-size:0.72rem;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:8px}
.itot{font-size:2.6rem;font-weight:800;letter-spacing:-0.03em;
background:linear-gradient(135deg,#f1f5f9,var(--accl));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
.stot{font-size:0.75rem;color:var(--t3);margin-top:8px}

/* SEZIONE */
.titsez{font-size:0.72rem;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}

/* TOP CAT */
.topcat{display:flex;flex-direction:column;gap:14px}
.itopcat{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:5px}
.icat{display:flex;align-items:center;gap:8px;grid-column:1}
.cnome{font-size:.83rem;font-weight:500;flex:1}
.cperc{font-size:.7rem;color:var(--t3)}
.cimp{font-size:.83rem;font-weight:600;grid-column:2;grid-row:1;align-self:center}
.bprog{grid-column:1/-1;height:4px;background:var(--inp);border-radius:100px;overflow:hidden}
.bfill{height:100%;border-radius:100px;transition:width .6s ease}

/* LISTA PREVIEW */
.lprev{display:flex;flex-direction:column}
.iprev{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--brd2)}
.iprev:last-child{border-bottom:none;padding-bottom:0}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pdesc{display:block;font-size:.875rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdata{font-size:.7rem;color:var(--t3)}
.pimp{font-size:.875rem;font-weight:700;white-space:nowrap}

/* VUOTA */
.cvuota{text-align:center;padding:40px 20px}
.evuota{font-size:2.5rem;margin-bottom:12px}
.tvuota{font-size:1rem;font-weight:600;color:var(--t2);margin-bottom:4px}
.svuota{font-size:.78rem;color:var(--t3)}

/* FAB */
.fab{position:fixed;bottom:calc(var(--nav) + 16px);
right:max(16px,calc(50vw - 224px));
width:58px;height:58px;background:var(--acc);color:#fff;border-radius:50%;
display:flex;align-items:center;justify-content:center;
box-shadow:0 8px 28px #6366f155;z-index:90;font-size:1.8rem;line-height:1;
transition:transform var(--tr),box-shadow var(--tr)}
.fab:active{transform:scale(.9);box-shadow:0 4px 12px #6366f144}

/* MODALE */
.mover{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);
z-index:200;display:flex;align-items:flex-end;animation:fi .2s ease}
@keyframes fi{from{opacity:0}}
.mbox{background:var(--bg2);border-radius:24px 24px 0 0;width:100%;max-width:480px;margin:0 auto;
max-height:92vh;max-height:92dvh;overflow-y:auto;padding:0 20px 40px;
animation:su .3s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--brd);border-bottom:none}
@keyframes su{from{transform:translateY(100%)}}
.mhdr{display:flex;align-items:center;justify-content:space-between;
padding:20px 0 16px;position:sticky;top:0;background:var(--bg2);z-index:1}
.mhdr::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
width:36px;height:4px;background:var(--brd);border-radius:100px}
.mhdr h2{font-size:1.15rem;font-weight:700}
.bico{width:34px;height:34px;border-radius:50%;background:var(--card);
display:flex;align-items:center;justify-content:center;color:var(--t2)}
.bico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* FORM */
.cimpo{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 24px}
.seuro{font-size:1.8rem;font-weight:700;color:var(--t3)}
.iimpo{font-size:2.8rem;font-weight:800;background:none;border:none;outline:none;
width:210px;color:var(--t1);letter-spacing:-.03em}
.iimpo::placeholder{color:var(--brd)}
.cgr{margin-bottom:18px}
.cgr label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;
letter-spacing:.08em;color:var(--t3);margin-bottom:10px}
.icmp{width:100%;background:var(--inp);border:1px solid var(--brd);border-radius:var(--rs);
padding:13px 14px;color:var(--t1);font-size:.95rem;outline:none;
transition:border-color var(--tr);-webkit-appearance:none;appearance:none}
.icmp:focus{border-color:var(--acc)}
.gcats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bcat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;
background:var(--inp);border:1.5px solid var(--brd);border-radius:var(--rs);
transition:all var(--tr);cursor:pointer}
.bcat:active{transform:scale(.94)}
.cemoji{font-size:1.25rem}
.clabel{font-size:.6rem;font-weight:600;color:var(--t2);text-align:center;line-height:1.2}
.bsalva{width:100%;background:var(--acc);color:#fff;padding:15px;border-radius:var(--rs);
font-size:.95rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;
margin-top:6px;transition:all var(--tr);letter-spacing:.02em}
.bsalva svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bsalva:active{background:#4f46e5;transform:scale(.98)}
.bsalva:disabled{opacity:.5}
.terr{color:var(--red);font-size:.78rem;margin-bottom:10px;text-align:center}

/* GRAFICI */
.chartbox{width:100%;overflow:hidden}
.pie-svg{display:block;margin:0 auto}

/* STATS GRID */
.gstat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cstat{text-align:center;padding:14px 10px}
.lstat{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:6px}
.vstat{font-size:1.05rem;font-weight:700}

/* LEGENDA */
.leg{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ileg{display:flex;align-items:center;gap:10px}
.dleg{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.nleg{flex:1;font-size:.8rem;color:var(--t2)}
.pleg{font-size:.7rem;color:var(--t3);width:30px;text-align:right}
.vleg{font-size:.8rem;font-weight:600;width:74px;text-align:right}

/* BARRE CHART */
.barchart{width:100%;overflow-x:auto}
.barchart-inner{min-width:100%;display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:10px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:20px}
.bar-rect{width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:4px;transition:height .5s ease;position:relative}
.bar-lbl{font-size:.55rem;color:var(--t3);white-space:nowrap}

/* STORICO */
.hstorico{display:flex;align-items:center;justify-content:space-between}
.bfilt{position:relative;width:40px;height:40px;background:var(--card);border-radius:var(--rx);
display:flex;align-items:center;justify-content:center;color:var(--t2)}
.bfilt svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bfilt.on{background:var(--accb);color:var(--accl)}
.bdot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--acc);border-radius:50%}
.breset{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--red);
padding:8px 12px;border-radius:var(--rx);background:var(--redb);margin-top:6px;border:none}
.ries{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:.85rem;color:var(--t3)}
.tfilt{font-weight:700;color:var(--t1);font-size:.95rem}
.lspese{display:flex;flex-direction:column;gap:8px}
.ispesa{display:flex;align-items:center;gap:12px;padding:14px 16px;transition:border-color var(--tr)}
.ispesa.del{border-color:var(--red)!important;animation:shk .3s ease}
@keyframes shk{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
.icocat{width:44px;height:44px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.dspesa{flex:1;min-width:0}
.rprinc{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ncat{font-size:.88rem;font-weight:600}
.impsp{font-size:.92rem;font-weight:700;white-space:nowrap}
.descsp{font-size:.73rem;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.datasp{font-size:.7rem;color:var(--t3);margin-top:2px}
.bdel{display:flex;align-items:center;gap:4px;padding:8px;border-radius:var(--rx);
color:var(--t3);transition:all var(--tr);flex-shrink:0;font-size:.7rem;white-space:nowrap}
.bdel svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bdel.conf{color:var(--red);background:var(--redb);padding:8px 10px;font-weight:700}

/* IMPOSTAZIONI */
.cpriv{border-color:#10b98128;background:linear-gradient(135deg,#1e293b,#0d2018)}
.phdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.phdr svg{width:22px;height:22px;flex-shrink:0}
.phdr h3{font-size:.95rem;font-weight:700;color:var(--grn)}
.ptxt{font-size:.78rem;color:var(--t2);line-height:1.65;margin-bottom:14px}
.pbadge{display:flex;flex-direction:column;gap:5px}
.pbadge span{font-size:.73rem;color:var(--grn);font-weight:500}
.shdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--t2)}
.shdr svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shdr h3{font-size:.95rem;font-weight:700;color:var(--t1)}
.sdesc{font-size:.78rem;color:var(--t3);margin-bottom:14px;line-height:1.6}
.idb{display:flex;flex-direction:column}
.rinfo{display:flex;justify-content:space-between;align-items:center;
padding:10px 0;border-bottom:1px solid var(--brd2);font-size:.85rem}
.rinfo:last-child{border-bottom:none}
.vinfo{font-weight:600}
.tgrn{color:var(--grn)!important}
.avv{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;
background:#f59e0b12;border:1px solid #f59e0b28;border-radius:var(--rx);
margin-bottom:14px;font-size:.74rem;color:var(--yel);line-height:1.5}
.avv svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
.bbk{display:flex;flex-direction:column;gap:10px}
.btnbk{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--rs);
border:1.5px solid var(--brd);background:var(--inp);text-align:left;
transition:all var(--tr);width:100%;cursor:pointer}
.btnbk svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btnbk:active{transform:scale(.97)}
.btnbk.exp{border-color:#10b98128;color:var(--grn)}
.btnbk.imp{border-color:#6366f128;color:var(--accl)}
.bktit{display:block;font-size:.88rem;font-weight:700}
.bkdesc{display:block;font-size:.7rem;opacity:.65;margin-top:2px}
.amsg{padding:12px 16px;border-radius:var(--rx);font-size:.85rem;font-weight:600;animation:sd .3s ease}
@keyframes sd{from{opacity:0;transform:translateY(-6px)}}
.amsg.ok{background:#10b98112;border:1px solid #10b98128;color:var(--grn)}
.amsg.er{background:var(--redb);border:1px solid #ef444428;color:var(--red)}
.appinfo{text-align:center;padding:20px}
.anome{font-size:1.15rem;font-weight:800;margin-bottom:4px}
.aver{font-size:.75rem;color:var(--t3);margin-bottom:3px}
.anota{font-size:.7rem;color:var(--t3)}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
height:100vh;gap:16px;color:var(--t2)}
.spin{width:36px;height:36px;border:3px solid var(--brd);border-top-color:var(--acc);
border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.6);cursor:pointer}
::selection{background:var(--accb);color:var(--accl)}
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading">
    <div class="spin"></div>
    <p>Caricamento...</p>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  COSTANTI
// ═══════════════════════════════════════════
const CATS=[
  {id:'alimentari',l:'Alimentari',e:'🛒',c:'#10b981'},
  {id:'benzina',l:'Benzina',e:'⛽',c:'#f59e0b'},
  {id:'svago',l:'Svago',e:'🎬',c:'#8b5cf6'},
  {id:'bollette',l:'Bollette',e:'💡',c:'#3b82f6'},
  {id:'casa',l:'Casa',e:'🏠',c:'#06b6d4'},
  {id:'salute',l:'Salute',e:'💊',c:'#ef4444'},
  {id:'abbigliamento',l:'Abbigliamento',e:'👕',c:'#ec4899'},
  {id:'trasporti',l:'Trasporti',e:'🚌',c:'#f97316'},
  {id:'ristorante',l:'Ristorante',e:'🍕',c:'#84cc16'},
  {id:'altro',l:'Altro',e:'📦',c:'#6b7280'}
];
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
            'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

function getCat(id){return CATS.find(c=>c.id===id)||CATS[9]}
function euro(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n)}
function fdata(s){return new Date(s).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})}
function fdataShort(s){return new Date(s).toLocaleDateString('it-IT',{day:'2-digit',month:'short'})}
function oggi(){return new Date().toISOString().split('T')[0]}

// ═══════════════════════════════════════════
//  INDEXEDDB
// ═══════════════════════════════════════════
let _db=null;
function getDB(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open('SpesaTrackerDB',1);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('spese')){
        const st=db.createObjectStore('spese',{keyPath:'id',autoIncrement:true});
        st.createIndex('anno_mese','anno_mese',{unique:false});
      }
    };
    r.onsuccess=e=>{_db=e.target.result;res(_db)};
    r.onerror=e=>rej(e);
  });
}
async function dbAdd(s){
  const db=await getDB();
  const d=new Date(s.data);
  const am=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  return new Promise((res,rej)=>{
    const tx=db.transaction('spese','readwrite');
    const r=tx.objectStore('spese').add({...s,anno_mese:am,importo:parseFloat(s.importo),createdAt:Date.now()});
    r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e);
  });
}
async function dbDel(id){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('spese','readwrite');
    const r=tx.objectStore('spese').delete(id);
    r.onsuccess=()=>res();r.onerror=e=>rej(e);
  });
}
async function dbAll(){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const r=db.transaction('spese','readonly').objectStore('spese').getAll();
    r.onsuccess=()=>res(r.result.sort((a,b)=>new Date(b.data)-new Date(a.data)||b.createdAt-a.createdAt));
    r.onerror=e=>rej(e);
  });
}
async function dbClear(){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const r=db.transaction('spese','readwrite').objectStore('spese').clear();
    r.onsuccess=()=>res();r.onerror=e=>rej(e);
  });
}

// ═══════════════════════════════════════════
//  STATO GLOBALE
// ═══════════════════════════════════════════
const S={
  tab:'home',
  spese:[],
  mese:{a:new Date().getFullYear(),m:new Date().getMonth()+1},
  modale:false,
  filtriAperti:false,
  filtroM:'tutti',
  filtroC:'tutte',
  confDel:null,
  msg:null,
  msgTimer:null
};

function setState(patch){
  Object.assign(S,patch);
  render();
}

function showMsg(t,tipo='ok'){
  if(S.msgTimer)clearTimeout(S.msgTimer);
  const timer=setTimeout(()=>setState({msg:null,msgTimer:null}),4000);
  setState({msg:{t,tipo},msgTimer:timer});
}

// ═══════════════════════════════════════════
//  AZIONI
// ═══════════════════════════════════════════
async function aggiungiSpesa(form){
  await dbAdd(form);
  S.spese=await dbAll();
  setState({modale:false});
}
async function eliminaSpesa(id){
  if(S.confDel===id){
    await dbDel(id);
    S.spese=await dbAll();
    setState({confDel:null});
  }else{
    if(S.confTimer)clearTimeout(S.confTimer);
    const t=setTimeout(()=>setState({confDel:null,confTimer:null}),3000);
    setState({confDel:id,confTimer:t});
  }
}
async function esporta(){
  const dati=await dbAll();
  const json=JSON.stringify({versione:'1.0',esportatoIl:new Date().toISOString(),spese:dati},null,2);
  const b=new Blob([json],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u;a.download=`spese-backup-${oggi()}.json`;a.click();
  URL.revokeObjectURL(u);
  showMsg('✅ Backup scaricato con successo!');
}
async function importa(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=async e=>{
      try{
        const c=JSON.parse(e.target.result);
        const lista=c.spese||c;
        await dbClear();
        for(const s of lista){const{id,...rest}=s;await dbAdd(rest);}
        S.spese=await dbAll();
        render();
        res(lista.length);
      }catch(err){rej(err);}
    };
    r.readAsText(file);
  });
}

function speseDelMese(){
  return S.spese.filter(s=>{
    const d=new Date(s.data);
    return d.getFullYear()===S.mese.a&&(d.getMonth()+1)===S.mese.m;
  });
}
function totaleDelMese(){return speseDelMese().reduce((a,s)=>a+s.importo,0)}
function isMeseCorrente(){
  const n=new Date();
  return S.mese.a===n.getFullYear()&&S.mese.m===n.getMonth()+1;
}
function speseFiltrate(){
  return S.spese.filter(s=>{
    const d=new Date(s.data);
    const mk=`${d.getFullYear()}-${d.getMonth()+1}`;
    return(S.filtroM==='tutti'||mk===S.filtroM)&&(S.filtroC==='tutte'||s.categoria===S.filtroC);
  });
}
function mesiDisp(){
  const set=new Set();
  S.spese.forEach(s=>{const d=new Date(s.data);set.add(`${d.getFullYear()}-${d.getMonth()+1}`);});
  const n=new Date();set.add(`${n.getFullYear()}-${n.getMonth()+1}`);
  return Array.from(set).map(k=>{
    const[a,m]=k.split('-').map(Number);
    return{key:k,l:`${MESI[m-1]} ${a}`,a,m};
  }).sort((a,b)=>b.a-a.a||b.m-a.m);
}

//  PIE CHART SVG NATIVO
// ═══════════════════════════════════════════
function renderPie(dati,totale){
  if(!dati.length)return'';
  const W=220,H=220,cx=110,cy=110,R=85,ri=52;
  let paths='',angolo=-Math.PI/2;
  dati.forEach(d=>{
    const frac=d.value/totale;
    const sweep=frac*2*Math.PI;
    const x1=cx+R*Math.cos(angolo),y1=cy+R*Math.sin(angolo);
    const x2=cx+R*Math.cos(angolo+sweep),y2=cy+R*Math.sin(angolo+sweep);
    const xi1=cx+ri*Math.cos(angolo),yi1=cy+ri*Math.sin(angolo);
    const xi2=cx+ri*Math.cos(angolo+sweep),yi2=cy+ri*Math.sin(angolo+sweep);
    const lg=sweep>Math.PI?1:0;
    paths+=`<path d="M${xi1},${yi1} L${x1},${y1} A${R},${R} 0 ${lg},1 ${x2},${y2} L${xi2},${yi2} A${ri},${ri} 0 ${lg},0 ${xi1},${yi1}" fill="${d.c}" opacity="0.92"/>`;
    angolo+=sweep;
  });
  return`<svg class="pie-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${paths}</svg>`;
}

// ═══════════════════════════════════════════
//  BAR CHART NATIVO
// ═══════════════════════════════════════════
function renderBars(dati){
  if(!dati.length)return'';
  const max=Math.max(...dati.map(d=>d.v));
  const bars=dati.map(d=>{
    const pct=max>0?Math.round((d.v/max)*100):0;
    return`<div class="bar-col">
      <div class="bar-rect" style="height:${Math.max(pct,3)}%;background:var(--acc)" title="${euro(d.v)}"></div>
      <span class="bar-lbl">${d.g}</span>
    </div>`;
  }).join('');
  return`<div class="barchart"><div class="barchart-inner">${bars}</div></div>`;
}

function viewStats(){
  const sdm=speseDelMese();
  const tot=sdm.reduce((a,s)=>a+s.importo,0);
  if(!sdm.length)return`
    <div class="titsez" style="font-size:1.4rem;font-weight:700;color:var(--t1);text-transform:none;letter-spacing:-.02em">Statistiche</div>
    <div class="card cvuota">
      <div class="evuota">📊</div>
      <div class="tvuota">Nessun dato da mostrare</div>
      <div class="svuota">${MESI[S.mese.m-1]} ${S.mese.a}</div>
    </div>`;

  const perCat={};
  sdm.forEach(s=>{perCat[s.categoria]=(perCat[s.categoria]||0)+s.importo;});
  const datiTorta=Object.entries(perCat).map(([id,v])=>{
    const cat=getCat(id);return{name:cat.l,value:v,c:cat.c,e:cat.e};
  }).sort((a,b)=>b.value-a.value);

  const perGiorno={};
  sdm.forEach(s=>{const g=new Date(s.data).getDate();perGiorno[g]=(perGiorno[g]||0)+s.importo;});
  const datiBarre=Object.entries(perGiorno)
    .sort((a,b)=>a[0]-b[0])
    .map(([g,v])=>({g:parseInt(g),v:parseFloat(v.toFixed(2))}));

  const giorni=new Set(sdm.map(s=>s.data)).size;
  const media=giorni>0?tot/giorni:0;

  const statsCards=[
    ['Totale',euro(tot)],['Media/giorno',euro(media)],
    ['N° Spese',sdm.length],['Categorie',datiTorta.length]
  ].map(([l,v])=>`<div class="card cstat"><div class="lstat">${l}</div><div class="vstat">${v}</div></div>`).join('');

  const legenda=datiTorta.map(d=>`
    <div class="ileg">
      <div class="dleg" style="background:${d.c}"></div>
      <span class="nleg">${d.e} ${d.name}</span>
      <span class="pleg">${Math.round((d.value/tot)*100)}%</span>
      <span class="vleg">${euro(d.value)}</span>
    </div>`).join('');

  return`
    <div class="titpag">Statistiche · ${MESI[S.mese.m-1]}</div>
    <div class="gstat">${statsCards}</div>
    <div class="card">
      <div class="titsez">Per Categoria</div>
      ${renderPie(datiTorta,tot)}
      <div class="leg">${legenda}</div>
    </div>
    ${datiBarre.length?`
    <div class="card">
      <div class="titsez">Andamento Giornaliero</div>
      ${renderBars(datiBarre)}
    </div>`:''}
  `;
}

  // NAV
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.addEventListener('click',()=>setState({tab:b.dataset.tab}));
  });

  // DASHBOARD
  const mesePrev=document.getElementById('mesePrev');
  const meseNext=document.getElementById('meseNext');
  if(mesePrev) mesePrev.addEventListener('click',()=>{
    let{a,m}=S.mese;m--;if(m<1){m=12;a--;}setState({mese:{a,m}});
  });
  if(meseNext) meseNext.addEventListener('click',()=>{
    let{a,m}=S.mese;m++;if(m>12){m=1;a++;}setState({mese:{a,m}});
  });

  const fab=document.getElementById('fabBtn');
  if(fab) fab.addEventListener('click',()=>{catSelezionata='alimentari';setState({modale:true});});

  // MODALE
  const mover=document.getElementById('mover');
  const mbox=document.getElementById('mbox');
  if(mover) mover.addEventListener('click',e=>{if(e.target===mover)setState({modale:false});});

  const chiudi=document.getElementById('chiudiModale');
  if(chiudi) chiudi.addEventListener('click',()=>setState({modale:false}));

  // Categorie nel modale
  document.querySelectorAll('[data-cat]').forEach(b=>{
    b.addEventListener('click',()=>{
      catSelezionata=b.dataset.cat;
      document.querySelectorAll('[data-cat]').forEach(btn=>{
        const cat=getCat(btn.dataset.cat);
        const sel=btn.dataset.cat===catSelezionata;
        btn.style.borderColor=sel?cat.c:'var(--brd)';
        btn.style.background=sel?cat.c+'20':'';
      });
    });
  });

  // Salva spesa
  const btnSalva=document.getElementById('btnSalva');
  if(btnSalva) btnSalva.addEventListener('click',async()=>{
    const imp=document.getElementById('fImporto').value;
    const data=document.getElementById('fData').value;
    const desc=document.getElementById('fDesc').value;
    const err=document.getElementById('fErr');

    if(!imp||parseFloat(imp)<=0){
      err.textContent='Inserisci un importo valido';err.style.display='block';return;
    }
    if(!data){err.textContent='Seleziona una data';err.style.display='block';return;}

    btnSalva.disabled=true;
    btnSalva.innerHTML=`${ic('check')} Salvataggio...`;
    try{
      await aggiungiSpesa({importo:imp,categoria:catSelezionata,data,descrizione:desc});
    }catch{
      err.textContent='Errore nel salvataggio';err.style.display='block';
      btnSalva.disabled=false;btnSalva.innerHTML=`${ic('check')} Salva Spesa`;
    }
  });

  // STORICO filtri
  const togFiltri=document.getElementById('togFiltri');
  if(togFiltri) togFiltri.addEventListener('click',()=>setState({filtriAperti:!S.filtriAperti}));

  const filtroMese=document.getElementById('filtroMese');
  if(filtroMese) filtroMese.addEventListener('change',()=>setState({filtroM:filtroMese.value}));

  const filtroCat=document.getElementById('filtroCat');
  if(filtroCat) filtroCat.addEventListener('change',()=>setState({filtroC:filtroCat.value}));

  const resetFiltri=document.getElementById('resetFiltri');
  if(resetFiltri) resetFiltri.addEventListener('click',()=>setState({filtroM:'tutti',filtroC:'tutte'}));

  // Elimina spese
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click',()=>eliminaSpesa(parseInt(b.dataset.del)));
  });

  // IMPOSTAZIONI
  const btnExp=document.getElementById('btnExp');
  if(btnExp) btnExp.addEventListener('click',esporta);

  const btnImp=document.getElementById('btnImp');
  const fileImp=document.getElementById('fileImp');
  if(btnImp) btnImp.addEventListener('click',()=>fileImp&&fileImp.click());
  if(fileImp) fileImp.addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const n=await importa(f);
      showMsg(`✅ Importate ${n} spese con successo!`);
    }catch{
      showMsg('❌ File non valido o corrotto','er');
    }
    e.target.value='';
  });
}

// ═══════════════════════════════════════════
//  SERVICE WORKER
// ═══════════════════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope: './'})
      .then(reg => {
        console.log('✅ SW registrato, scope:', reg.scope);
      })
      .catch(err => {
        console.warn('SW non registrato:', err);
      });
  });
}

// Listener per il prompt di installazione
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Mostra il banner personalizzato
  document.getElementById('install-banner').style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').style.display = 'none';
  deferredPrompt = null;
});

// ═══════════════════════════════════════════
//  AVVIO
// ═══════════════════════════════════════════
async function init(){
  try{
    S.spese=await dbAll();
  }catch(e){
    console.error('DB error:',e);
    S.spese=[];
  }
  document.getElementById('app').innerHTML=
    '<div class="scroll"><div class="pag"></div></div>';
  render();
}

init();
</script>
