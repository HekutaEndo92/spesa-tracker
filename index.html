<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0f1e"/>
<title>💰 SpesaTracker</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg-primary:#0a0f1e;--bg-secondary:#0f172a;--bg-card:#1e293b;
  --bg-card-hover:#263447;--bg-input:#0f172a;--border:#334155;
  --border-light:#1e293b;--text-primary:#f1f5f9;--text-secondary:#94a3b8;
  --text-muted:#64748b;--accent:#6366f1;--accent-light:#818cf8;
  --accent-bg:#6366f120;--success:#10b981;--danger:#ef4444;
  --danger-bg:#ef444420;--warning:#f59e0b;--radius:16px;
  --radius-sm:10px;--radius-xs:8px;--shadow:0 4px 24px rgba(0,0,0,0.4);
  --nav-height:70px;--transition:0.2s ease
}
html{font-size:16px}
body{background:var(--bg-primary);color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;overflow-x:hidden;min-height:100vh}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;position:relative}
.contenuto{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-height) + 16px);scrollbar-width:none}
.contenuto::-webkit-scrollbar{display:none}
.pagina{padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.titolo-pagina{font-size:1.4rem;font-weight:700;letter-spacing:-0.02em}

/* CARD */
.card{background:var(--bg-card);border-radius:var(--radius);padding:18px;border:1px solid var(--border-light)}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;height:var(--nav-height);
  background:var(--bg-card);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 8px;z-index:100
}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 16px;border-radius:var(--radius-sm);color:var(--text-muted);
  transition:all var(--transition);min-width:60px;font-size:0.68rem;font-weight:500}
.nav-btn svg{width:22px;height:22px}
.nav-btn.attivo{color:var(--accent-light);background:var(--accent-bg)}

/* NAVIGAZIONE MESE */
.nav-mese{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.info-mese{display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.9rem;font-weight:500}
.badge-corrente{background:var(--accent-bg);color:var(--accent-light);font-size:0.62rem;
  padding:2px 8px;border-radius:100px;font-weight:600}
.btn-freccia{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:1.4rem;color:var(--text-secondary);background:var(--bg-input);
  transition:all var(--transition)}
.btn-freccia:disabled{opacity:0.3;cursor:not-allowed}
.btn-freccia:not(:disabled):active{background:var(--border)}

/* CARD TOTALE */
.card-totale{text-align:center;padding:28px 20px;
  background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);
  border:1px solid var(--accent-bg);position:relative;overflow:hidden}
.card-totale::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at center,#6366f108 0%,transparent 60%)}
.label-totale{font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.1em;font-weight:600;margin-bottom:8px}
.importo-totale{font-size:2.8rem;font-weight:800;letter-spacing:-0.03em;
  background:linear-gradient(135deg,#f1f5f9,var(--accent-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
.sottotesto-totale{font-size:0.78rem;color:var(--text-muted);margin-top:8px}

/* TOP CATEGORIE */
.titolo-sezione{font-size:0.78rem;font-weight:700;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.lista-top-cat{display:flex;flex-direction:column;gap:14px}
.item-top-cat{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:6px}
.info-cat{display:flex;align-items:center;gap:8px;grid-column:1}
.cat-nome{font-size:.85rem;font-weight:500;flex:1}
.cat-perc{font-size:.72rem;color:var(--text-muted)}
.cat-importo{font-size:.85rem;font-weight:600;grid-column:2;grid-row:1;align-self:center}
.barra-prog{grid-column:1/-1;height:4px;background:var(--bg-input);border-radius:100px;overflow:hidden}
.barra-fill{height:100%;border-radius:100px;transition:width .6s ease}

/* PREVIEW SPESE */
.lista-preview{display:flex;flex-direction:column}
.item-preview{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border-light)}
.item-preview:last-child{border-bottom:none;padding-bottom:0}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.prev-info{flex:1;min-width:0}
.prev-desc{display:block;font-size:.875rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev-data{font-size:.72rem;color:var(--text-muted)}
.prev-imp{font-size:.875rem;font-weight:700;white-space:nowrap}

/* CARD VUOTA */
.card-vuota{text-align:center;padding:40px 20px}
.emoji-vuoto{font-size:2.5rem;margin-bottom:12px}
.testo-vuoto{font-size:1rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.sotto-vuoto{font-size:.8rem;color:var(--text-muted)}

/* FAB */
.fab{position:fixed;bottom:calc(var(--nav-height) + 16px);
  right:max(16px,calc(50vw - 224px));
  width:58px;height:58px;background:var(--accent);color:white;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px #6366f150;z-index:90;border:none;
  transition:all var(--transition);font-size:28px}
.fab:active{transform:scale(.92)}

/* MODALE */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:flex-end;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}}
.modal-box{background:var(--bg-secondary);border-radius:24px 24px 0 0;width:100%;
  max-width:480px;margin:0 auto;max-height:92vh;overflow-y:auto;
  padding:8px 20px 40px;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1);
  border:1px solid var(--border);border-bottom:none}
@keyframes slideUp{from{transform:translateY(100%)}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 20px;position:sticky;top:0;background:var(--bg-secondary);z-index:1}
.modal-hdr::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:40px;height:4px;background:var(--border);border-radius:100px}
.modal-hdr h2{font-size:1.2rem;font-weight:700;padding-top:10px}
.btn-icon{width:36px;height:36px;border-radius:50%;background:var(--bg-card);
  display:flex;align-items:center;justify-content:center;color:var(--text-secondary);
  margin-top:10px;font-size:18px}

/* FORM */
.campo-importo{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 28px}
.simbolo-euro{font-size:2rem;font-weight:700;color:var(--text-muted)}
.input-importo{font-size:3rem;font-weight:800;background:none;border:none;outline:none;
  text-align:left;width:200px;color:var(--text-primary);letter-spacing:-.03em}
.input-importo::placeholder{color:var(--border)}
.campo-gruppo{margin-bottom:20px}
.campo-gruppo label{display:block;font-size:.72rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-muted);margin-bottom:10px}
.input-campo{width:100%;background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:13px 14px;color:var(--text-primary);
  font-size:.95rem;outline:none;transition:border-color var(--transition);-webkit-appearance:none}
.input-campo:focus{border-color:var(--accent)}
.griglia-cat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn-cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;
  background:var(--bg-input);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  transition:all var(--transition);cursor:pointer}
.btn-cat:active{transform:scale(.95)}
.cat-emoji{font-size:1.3rem}
.cat-label{font-size:.62rem;font-weight:500;color:var(--text-secondary);text-align:center}
.btn-salva{width:100%;background:var(--accent);color:white;padding:16px;
  border-radius:var(--radius-sm);font-size:1rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:8px;transition:all var(--transition)}
.btn-salva:active{background:#4f46e5;transform:scale(.98)}
.btn-salva:disabled{opacity:.6}
.testo-err{color:var(--danger);font-size:.8rem;margin-bottom:12px;text-align:center}

/* STATISTICHE */
.griglia-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card-stat{text-align:center;padding:16px 12px}
.label-stat{font-size:.68rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-muted);margin-bottom:6px}
.valore-stat{font-size:1.1rem;font-weight:700}
.tooltip-c{background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-xs);padding:10px 14px;box-shadow:var(--shadow)}
.tooltip-n{font-size:.75rem;color:var(--text-muted);margin-bottom:2px}
.tooltip-v{font-size:.9rem;font-weight:700}
.legenda{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item-leg{display:flex;align-items:center;gap:10px}
.dot-leg{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.nome-leg{flex:1;font-size:.82rem;color:var(--text-secondary)}
.perc-leg{font-size:.72rem;color:var(--text-muted);width:32px;text-align:right}
.val-leg{font-size:.82rem;font-weight:600;width:72px;text-align:right}

/* STORICO */
.header-storico{display:flex;align-items:center;justify-content:space-between}
.btn-filtri{position:relative;width:40px;height:40px;background:var(--bg-card);
  border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);transition:all var(--transition);font-size:18px}
.btn-filtri.attivo{background:var(--accent-bg);color:var(--accent-light)}
.card-filtri{padding:16px}
.btn-reset{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--danger);
  padding:8px 12px;border-radius:var(--radius-xs);background:var(--danger-bg);margin-top:4px}
.riepilogo-st{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;font-size:.85rem;color:var(--text-muted)}
.tot-filtrato{font-weight:700;color:var(--text-primary);font-size:1rem}
.lista-spese{display:flex;flex-direction:column;gap:8px}
.item-spesa{display:flex;align-items:center;gap:14px;padding:14px 16px;
  transition:border-color var(--transition)}
.item-spesa.eliminando{border-color:var(--danger)!important;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.icona-cat{width:44px;height:44px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.dati-spesa{flex:1;min-width:0}
.riga-princ{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nome-cat{font-size:.9rem;font-weight:600}
.imp-spesa{font-size:.95rem;font-weight:700;white-space:nowrap}
.desc-spesa{font-size:.75rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.data-spesa{font-size:.72rem;color:var(--text-muted);margin-top:2px}
.btn-del{display:flex;align-items:center;gap:4px;padding:8px;
  border-radius:var(--radius-xs);color:var(--text-muted);transition:all var(--transition);
  white-space:nowrap;flex-shrink:0;font-size:15px}
.btn-del:active,.btn-del.conf{color:var(--danger);background:var(--danger-bg)}
.btn-del.conf{padding:8px 10px;font-size:.68rem;font-weight:600}

/* IMPOSTAZIONI */
.card-privacy{border-color:#10b98130;background:linear-gradient(135deg,#1e293b,#0d2018)}
.priv-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.priv-hdr h3{font-size:1rem;font-weight:700;color:var(--success)}
.priv-txt{font-size:.8rem;color:var(--text-secondary);line-height:1.6;margin-bottom:14px}
.priv-badge{display:flex;flex-direction:column;gap:6px}
.priv-badge span{font-size:.76rem;color:var(--success);font-weight:500}
.sez-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--text-secondary)}
.sez-hdr h3{font-size:1rem;font-weight:700;color:var(--text-primary)}
.sez-desc{font-size:.8rem;color:var(--text-muted);margin-bottom:14px;line-height:1.6}
.info-db{display:flex;flex-direction:column}
.riga-info{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border-light);font-size:.875rem}
.riga-info:last-child{border-bottom:none}
.val-info{font-weight:600}
.text-green{color:var(--success)!important}
.avviso{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;
  background:#f59e0b15;border:1px solid #f59e0b30;border-radius:var(--radius-xs);
  margin-bottom:16px;font-size:.76rem;color:var(--warning);line-height:1.4}
.bottoni-bk{display:flex;flex-direction:column;gap:10px}
.btn-bk{display:flex;align-items:center;gap:14px;padding:14px 16px;
  border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--bg-input);text-align:left;transition:all var(--transition);width:100%}
.btn-bk:active{transform:scale(.98)}
.btn-bk.exp{border-color:#10b98130;color:var(--success)}
.btn-bk.imp{border-color:#6366f130;color:var(--accent-light)}
.bk-tit{display:block;font-size:.9rem;font-weight:700}
.bk-desc{display:block;font-size:.72rem;opacity:.7;margin-top:2px}
.alert-msg{padding:12px 16px;border-radius:var(--radius-xs);font-size:.875rem;
  font-weight:500;animation:slideD .3s ease}
@keyframes slideD{from{opacity:0;transform:translateY(-8px)}}
.alert-msg.ok{background:#10b98115;border:1px solid #10b98130;color:var(--success)}
.alert-msg.err{background:var(--danger-bg);border:1px solid #ef444430;color:var(--danger)}
.card-app-info{text-align:center;padding:24px}
.app-nome-info{font-size:1.2rem;font-weight:800;margin-bottom:4px}
.app-ver{font-size:.78rem;color:var(--text-muted);margin-bottom:4px}
.app-nota{font-size:.72rem;color:var(--text-muted)}

/* CARICAMENTO */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;gap:16px;color:var(--text-secondary)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}
::selection{background:var(--accent-bg);color:var(--accent-light)}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;
const {
  PieChart, Pie, Cell, Tooltip, ResponsiveContainer,
  BarChart, Bar, XAxis, YAxis, CartesianGrid
} = Recharts;

/* ===== COSTANTI ===== */
const CATEGORIE = [
  {id:'alimentari',label:'Alimentari',emoji:'🛒',colore:'#10b981'},
  {id:'benzina',label:'Benzina',emoji:'⛽',colore:'#f59e0b'},
  {id:'svago',label:'Svago',emoji:'🎬',colore:'#8b5cf6'},
  {id:'bollette',label:'Bollette',emoji:'💡',colore:'#3b82f6'},
  {id:'casa',label:'Casa',emoji:'🏠',colore:'#06b6d4'},
  {id:'salute',label:'Salute',emoji:'💊',colore:'#ef4444'},
  {id:'abbigliamento',label:'Abbigliamento',emoji:'👕',colore:'#ec4899'},
  {id:'trasporti',label:'Trasporti',emoji:'🚌',colore:'#f97316'},
  {id:'ristorante',label:'Ristorante',emoji:'🍕',colore:'#84cc16'},
  {id:'altro',label:'Altro',emoji:'📦',colore:'#6b7280'}
];

const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
              'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

function getCat(id){ return CATEGORIE.find(c=>c.id===id)||CATEGORIE[9]; }

function euro(n){
  return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
}

function fData(s){
  return new Date(s).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
}

/* ===== INDEXEDDB ===== */
const DB_NAME='SpesaTrackerDB', DB_VER=1, STORE='spese';
let _db=null;

async function getDB(){
  if(_db) return _db;
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        const st=db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});
        st.createIndex('data','data',{unique:false});
        st.createIndex('anno_mese','anno_mese',{unique:false});
      }
    };
    req.onsuccess=e=>{_db=e.target.result;res(_db)};
    req.onerror=e=>rej(e);
  });
}

async function dbAdd(spesa){
  const db=await getDB();
  const d=new Date(spesa.data);
  const anno_mese=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    const req=tx.objectStore(STORE).add({
      ...spesa,anno_mese,importo:parseFloat(spesa.importo),createdAt:Date.now()
    });
    req.onsuccess=()=>res(req.result);
    req.onerror=e=>rej(e);
  });
}

async function dbDel(id){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    const req=tx.objectStore(STORE).delete(id);
    req.onsuccess=()=>res();
    req.onerror=e=>rej(e);
  });
}

async function dbAll(){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const req=db.transaction(STORE,'readonly').objectStore(STORE).getAll();
    req.onsuccess=()=>res(
      req.result.sort((a,b)=>new Date(b.data)-new Date(a.data)||b.createdAt-a.createdAt)
    );
    req.onerror=e=>rej(e);
  });
}

async function dbClear(){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    const req=tx.objectStore(STORE).clear();
    req.onsuccess=()=>res();
    req.onerror=e=>rej(e);
  });
}

/* ===== HOOK ===== */
function useSpese(){
  const [spese,setSpese]=useState([]);
  const [loading,setLoading]=useState(true);
  const oggi=new Date();
  const [mese,setMese]=useState({anno:oggi.getFullYear(),mese:oggi.getMonth()+1});

  const carica=useCallback(async()=>{
    setLoading(true);
    try{ setSpese(await dbAll()); }
    catch(e){ console.error(e); }
    finally{ setLoading(false); }
  },[]);

  useEffect(()=>{ carica(); },[carica]);

  const aggiungi=useCallback(async(s)=>{ await dbAdd(s); await carica(); },[carica]);
  const elimina=useCallback(async(id)=>{ await dbDel(id); await carica(); },[carica]);

  const esporta=useCallback(async()=>{
    const dati=await dbAll();
    const json=JSON.stringify({versione:'1.0',esportatoIl:new Date().toISOString(),spese:dati},null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`spese-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click(); URL.revokeObjectURL(url);
  },[]);

  const importa=useCallback(async(file)=>{
    return new Promise((res,rej)=>{
      const reader=new FileReader();
      reader.onload=async e=>{
        try{
          const c=JSON.parse(e.target.result);
          const lista=c.spese||c;
          await dbClear();
          for(const s of lista){
            const {id,...rest}=s;
            await dbAdd(rest);
          }
          await carica();
          res(lista.length);
        }catch(err){rej(err);}
      };
      reader.readAsText(file);
    });
  },[carica]);

  const speseDelMese=useMemo(()=>spese.filter(s=>{
    const d=new Date(s.data);
    return d.getFullYear()===mese.anno&&(d.getMonth()+1)===mese.mese;
  }),[spese,mese]);

  const totale=useMemo(()=>speseDelMese.reduce((a,s)=>a+s.importo,0),[speseDelMese]);

  return {spese,speseDelMese,totale,loading,mese,setMese,aggiungi,elimina,esporta,importa};
}

/* ===== MODALE AGGIUNGI ===== */
function ModaleAggiungi({onChiudi,onAggiungi}){
  const oggi=new Date().toISOString().split('T')[0];
  const [form,setForm]=useState({importo:'',categoria:'alimentari',data:oggi,descrizione:''});
  const [err,setErr]=useState('');
  const [saving,setSaving]=useState(false);

  const submit=async e=>{
    e.preventDefault();
    if(!form.importo||parseFloat(form.importo)<=0){setErr('Inserisci un importo valido');return;}
    if(!form.data){setErr('Seleziona una data');return;}
    setSaving(true);
    try{ await onAggiungi(form); onChiudi(); }
    catch{ setErr('Errore nel salvataggio. Riprova.'); setSaving(false); }
  };

  return(
    <div className="modal-overlay" onClick={onChiudi}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-hdr">
          <h2>Nuova Spesa</h2>
          <button className="btn-icon" onClick={onChiudi}><IconX/></button>
        </div>
        <form onSubmit={submit}>
          <div className="campo-importo">
            <span className="simbolo-euro">€</span>
            <input type="number" step="0.01" min="0.01" placeholder="0,00"
              value={form.importo} onChange={e=>setForm(f=>({...f,importo:e.target.value}))}
              className="input-importo" autoFocus inputMode="decimal"/>
          </div>
          <div className="campo-gruppo">
            <label>Categoria</label>
            <div className="griglia-cat">
              {CATEGORIE.map(cat=>(
                <button key={cat.id} type="button"
                  className="btn-cat"
                  style={form.categoria===cat.id?{borderColor:cat.colore,backgroundColor:`${cat.colore}20`}:{}}
                  onClick={()=>setForm(f=>({...f,categoria:cat.id}))}>
                  <span className="cat-emoji">{cat.emoji}</span>
                  <span className="cat-label">{cat.label}</span>
                </button>
              ))}
            </div>
          </div>
          <div className="campo-gruppo">
            <label>Data</label>
            <input type="date" value={form.data} max={oggi}
              onChange={e=>setForm(f=>({...f,data:e.target.value}))}
              className="input-campo"/>
          </div>
          <div className="campo-gruppo">
            <label>Descrizione (opzionale)</label>
            <input type="text" placeholder="Es. Spesa al supermercato..."
              value={form.descrizione} maxLength={100}
              onChange={e=>setForm(f=>({...f,descrizione:e.target.value}))}
              className="input-campo"/>
          </div>
          {err&&<p className="testo-err">{err}</p>}
          <button type="submit" className="btn-salva" disabled={saving}>
            <IconCheck/>
            {saving?'Salvataggio...':'Salva Spesa'}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ===== DASHBOARD ===== */
function Dashboard({speseDelMese,totale,mese,setMese,aggiungi}){
  const [aperto,setAperto]=useState(false);
  const oggi=new Date();
  const isMeseCorrente=mese.anno===oggi.getFullYear()&&mese.mese===oggi.getMonth()+1;

  const cambia=dir=>{
    setMese(p=>{
      let m=p.mese+dir,a=p.anno;
      if(m>12){m=1;a++;}
      if(m<1){m=12;a--;}
      return {anno:a,mese:m};
    });
  };

  const perCat=useMemo(()=>{
    const r={};
    speseDelMese.forEach(s=>{r[s.categoria]=(r[s.categoria]||0)+s.importo;});
    return Object.entries(r).sort((a,b)=>b[1]-a[1]).slice(0,3);
  },[speseDelMese]);

  const recenti=speseDelMese.slice(0,5);

  return(
    <div className="pagina">
      <div className="card nav-mese">
        <button className="btn-freccia" onClick={()=>cambia(-1)}>‹</button>
        <div className="info-mese">
          <IconCal/>
          <span>{MESI[mese.mese-1]} {mese.anno}</span>
          {isMeseCorrente&&<span className="badge-corrente">Corrente</span>}
        </div>
        <button className="btn-freccia" onClick={()=>cambia(1)} disabled={isMeseCorrente}>›</button>
      </div>

      <div className="card card-totale">
        <p className="label-totale">Totale Speso</p>
        <h1 className="importo-totale">{euro(totale)}</h1>
        <p className="sottotesto-totale">
          {speseDelMese.length} {speseDelMese.length===1?'spesa':'spese'} registrate
        </p>
      </div>

      {perCat.length>0&&(
        <div className="card">
          <h3 className="titolo-sezione">Top Categorie</h3>
          <div className="lista-top-cat">
            {perCat.map(([id,val])=>{
              const cat=getCat(id);
              const pct=totale>0?Math.round((val/totale)*100):0;
              return(
                <div key={id} className="item-top-cat">
                  <div className="info-cat">
                    <span>{cat.emoji}</span>
                    <span className="cat-nome">{cat.label}</span>
                    <span className="cat-perc">{pct}%</span>
                  </div>
                  <span className="cat-importo">{euro(val)}</span>
                  <div className="barra-prog">
                    <div className="barra-fill" style={{width:`${pct}%`,backgroundColor:cat.colore}}/>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {recenti.length>0?(
        <div className="card">
          <h3 className="titolo-sezione">Ultime Spese</h3>
          <div className="lista-preview">
            {recenti.map(s=>{
              const cat=getCat(s.categoria);
              return(
                <div key={s.id} className="item-preview">
                  <div className="cat-dot" style={{backgroundColor:cat.colore}}/>
                  <div className="prev-info">
                    <span className="prev-desc">{s.descrizione||cat.label}</span>
                    <span className="prev-data">
                      {new Date(s.data).toLocaleDateString('it-IT',{day:'2-digit',month:'short'})}
                    </span>
                  </div>
                  <span className="prev-imp">{euro(s.importo)}</span>
                </div>
              );
            })}
          </div>
        </div>
      ):(
        <div className="card card-vuota">
          <p className="emoji-vuoto">💸</p>
          <p className="testo-vuoto">Nessuna spesa questo mese</p>
          <p className="sotto-vuoto">Premi + per aggiungerne una</p>
        </div>
      )}

      <button className="fab" onClick={()=>setAperto(true)} aria-label="Aggiungi spesa">＋</button>
      {aperto&&<ModaleAggiungi onChiudi={()=>setAperto(false)} onAggiungi={aggiungi}/>}
    </div>
  );
}

/* ===== STATISTICHE ===== */
function Statistiche({speseDelMese,mese}){
  const totale=speseDelMese.reduce((a,s)=>a+s.importo,0);

  const datiTorta=useMemo(()=>{
    const r={};
    speseDelMese.forEach(s=>{r[s.categoria]=(r[s.categoria]||0)+s.importo;});
    return Object.entries(r).map(([id,v])=>{
      const cat=getCat(id);
      return {name:cat.label,value:v,colore:cat.colore,emoji:cat.emoji};
    }).sort((a,b)=>b.value-a.value);
  },[speseDelMese]);

  const datiBarre=useMemo(()=>{
    const r={};
    speseDelMese.forEach(s=>{
      const g=new Date(s.data).getDate();
      r[g]=(r[g]||0)+s.importo;
    });
    return Object.entries(r).map(([g,v])=>({giorno:parseInt(g),totale:parseFloat(v.toFixed(2))}))
      .sort((a,b)=>a.giorno-b.giorno);
  },[speseDelMese]);

  const media=useMemo(()=>{
    const giorni=new Set(speseDelMese.map(s=>s.data)).size;
    return giorni>0?totale/giorni:0;
  },[speseDelMese,totale]);

  const TooltipP=({active,payload})=>active&&payload?.length?(
    <div className="tooltip-c">
      <p className="tooltip-n">{payload[0].payload.emoji} {payload[0].name}</p>
      <p className="tooltip-v">{euro(payload[0].value)}</p>
    </div>
  ):null;

  const TooltipB=({active,payload,label})=>active&&payload?.length?(
    <div className="tooltip-c">
      <p className="tooltip-n">Giorno {label}</p>
      <p className="tooltip-v">{euro(payload[0].value)}</p>
    </div>
  ):null;

  if(speseDelMese.length===0) return(
    <div className="pagina">
      <h2 className="titolo-pagina">Statistiche</h2>
      <div className="card card-vuota">
        <p className="emoji-vuoto">📊</p>
        <p className="testo-vuoto">Nessun dato da mostrare</p>
        <p className="sotto-vuoto">{MESI[mese.mese-1]} {mese.anno}</p>
      </div>
    </div>
  );

  return(
    <div className="pagina">
      <h2 className="titolo-pagina">Statistiche · {MESI[mese.mese-1]}</h2>

      <div className="griglia-stats">
        {[
          ['Totale',euro(totale)],
          ['Media/giorno',euro(media)],
          ['N° Spese',speseDelMese.length],
          ['Categorie',datiTorta.length]
        ].map(([l,v])=>(
          <div key={l} className="card card-stat">
            <p className="label-stat">{l}</p>
            <p className="valore-stat">{v}</p>
          </div>
        ))}
      </div>

      <div className="card">
        <h3 className="titolo-sezione">Per Categoria</h3>
        <ResponsiveContainer width="100%" height={200}>
          <PieChart>
            <Pie data={datiTorta} cx="50%" cy="50%"
              innerRadius={50} outerRadius={85} paddingAngle={3} dataKey="value">
              {datiTorta.map((e,i)=><Cell key={i} fill={e.colore} stroke="none"/>)}
            </Pie>
            <Tooltip content={<TooltipP/>}/>
          </PieChart>
        </ResponsiveContainer>
        <div className="legenda">
          {datiTorta.map((it,i)=>(
            <div key={i} className="item-leg">
              <div className="dot-leg" style={{backgroundColor:it.colore}}/>
              <span className="nome-leg">{it.emoji} {it.name}</span>
              <span className="perc-leg">{Math.round((it.value/totale)*100)}%</span>
              <span className="val-leg">{euro(it.value)}</span>
            </div>
          ))}
        </div>
      </div>

      {datiBarre.length>0&&(
        <div className="card">
          <h3 className="titolo-sezione">Andamento Giornaliero</h3>
          <ResponsiveContainer width="100%" height={190}>
            <BarChart data={datiBarre} margin={{top:5,right:5,left:-20,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1e293b"/>
              <XAxis dataKey="giorno" tick={{fill:'#94a3b8',fontSize:11}} axisLine={false} tickLine={false}/>
              <YAxis tick={{fill:'#94a3b8',fontSize:10}} axisLine={false} tickLine={false}
                tickFormatter={v=>`€${v}`}/>
              <Tooltip content={<TooltipB/>}/>
              <Bar dataKey="totale" fill="#6366f1" radius={[4,4,0,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      )}
    </div>
  );
}

/* ===== STORICO ===== */
function Storico({spese,elimina}){
  const [filtroM,setFiltroM]=useState('tutti');
  const [filtroCat,setFiltroCat]=useState('tutte');
  const [confEl,setConfEl]=useState(null);
  const [filtriAp,setFiltriAp]=useState(false);

  const mesiDisp=useMemo(()=>{
    const s=new Set();
    spese.forEach(sp=>{
      const d=new Date(sp.data);
      s.add(`${d.getFullYear()}-${d.getMonth()+1}`);
    });
    const ora=new Date();
    s.add(`${ora.getFullYear()}-${ora.getMonth()+1}`);
    return Array.from(s).map(m=>{
      const [a,ms]=m.split('-').map(Number);
      return {key:m,label:`${MESI[ms-1]} ${a}`,anno:a,mese:ms};
    }).sort((a,b)=>b.anno-a.anno||b.mese-a.mese);
  },[spese]);

  const filtrate=useMemo(()=>spese.filter(s=>{
    const d=new Date(s.data);
    const mk=`${d.getFullYear()}-${d.getMonth()+1}`;
    return (filtroM==='tutti'||mk===filtroM)&&(filtroCat==='tutte'||s.categoria===filtroCat);
  }),[spese,filtroM,filtroCat]);

  const totFilt=filtrate.reduce((a,s)=>a+s.importo,0);
  const filtriAttivi=filtroM!=='tutti'||filtroCat!=='tutte';

  const handleDel=async id=>{
    if(confEl===id){ await elimina(id); setConfEl(null); }
    else{ setConfEl(id); setTimeout(()=>setConfEl(null),3000); }
  };

  return(
    <div className="pagina">
      <div className="header-storico">
        <h2 className="titolo-pagina">Storico</h2>
        <button className={`btn-filtri${filtriAttivi?' attivo':''}`}
          onClick={()=>setFiltriAp(!filtriAp)}>
          <IconFilter/>
          {filtriAttivi&&<span style={{position:'absolute',top:4,right:4,width:8,height:8,
            background:'var(--accent)',borderRadius:'50%'}}/>}
        </button>
      </div>

      {filtriAp&&(
        <div className="card card-filtri">
          <div className="campo-gruppo">
            <label>Mese</label>
            <select value={filtroM} onChange={e=>setFiltroM(e.target.value)} className="input-campo">
              <option value="tutti">Tutti i mesi</option>
              {mesiDisp.map(m=><option key={m.key} value={m.key}>{m.label}</option>)}
            </select>
          </div>
          <div className="campo-gruppo" style={{marginBottom:filtriAttivi?8:0}}>
            <label>Categoria</label>
            <select value={filtroCat} onChange={e=>setFiltroCat(e.target.value)} className="input-campo">
              <option value="tutte">Tutte le categorie</option>
              {CATEGORIE.map(c=><option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}
            </select>
          </div>
          {filtriAttivi&&(
            <button className="btn-reset"
              onClick={()=>{setFiltroM('tutti');setFiltroCat('tutte');}}>
              ✕ Azzera filtri
            </button>
          )}
        </div>
      )}

      <div className="card riepilogo-st">
        <span>{filtrate.length} spese</span>
        <span className="tot-filtrato">{euro(totFilt)}</span>
      </div>

      {filtrate.length===0?(
        <div className="card card-vuota">
          <p className="emoji-vuoto">🔍</p>
          <p className="testo-vuoto">Nessuna spesa trovata</p>
        </div>
      ):(
        <div className="lista-spese">
          {filtrate.map(s=>{
            const cat=getCat(s.categoria);
            const el=confEl===s.id;
            return(
              <div key={s.id} className={`card item-spesa${el?' eliminando':''}`}
                style={el?{borderColor:'var(--danger)'}:{}}>
                <div className="icona-cat" style={{backgroundColor:`${cat.colore}25`}}>
                  {cat.emoji}
                </div>
                <div className="dati-spesa">
                  <div className="riga-princ">
                    <span className="nome-cat">{cat.label}</span>
                    <span className="imp-spesa">{euro(s.importo)}</span>
                  </div>
                  {s.descrizione&&<p className="desc-spesa">{s.descrizione}</p>}
                  <p className="data-spesa">{fData(s.data)}</p>
                </div>
                <button className={`btn-del${el?' conf':''}`} onClick={()=>handleDel(s.id)}>
                  <IconTrash/>
                  {el&&<span> OK?</span>}
                </button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ===== IMPOSTAZIONI ===== */
function Impostazioni({esporta,importa,totSpese}){
  const [msg,setMsg]=useState(null);
  const [importing,setImporting]=useState(false);
  const fileRef=useRef(null);

  const showMsg=(t,tipo='ok')=>{
    setMsg({t,tipo});
    setTimeout(()=>setMsg(null),4000);
  };

  const handleExp=async()=>{
    try{ await esporta(); showMsg('✅ Backup scaricato!'); }
    catch{ showMsg('❌ Errore esportazione','err'); }
  };

  const handleImp=async e=>{
    const f=e.target.files[0];
    if(!f)return;
    setImporting(true);
    try{ const n=await importa(f); showMsg(`✅ Importate ${n} spese!`); }
    catch{ showMsg('❌ File non valido','err'); }
    finally{ setImporting(false); e.target.value=''; }
  };

  return(
    <div className="pagina">
      <h2 className="titolo-pagina">Impostazioni</h2>
      {msg&&<div className={`alert-msg ${msg.tipo}`}>{msg.t}</div>}

      <div className="card card-privacy">
        <div className="priv-hdr">
          <IconShield/><h3>100% Privato & Offline</h3>
        </div>
        <p className="priv-txt">
          I tuoi dati non lasciano mai questo dispositivo.
          Nessun server, nessun cloud, nessuna connessione internet necessaria.
          Tutto salvato nel database locale del browser (IndexedDB).
        </p>
        <div className="priv-badge">
          <span>🔒 Zero trasmissioni di dati</span>
          <span>📴 Funziona offline</span>
          <span>🗄️ Solo memoria locale</span>
        </div>
      </div>

      <div className="card">
        <div className="sez-hdr"><IconDB/><h3>Database Locale</h3></div>
        <div className="info-db">
          {[
            ['Spese registrate', totSpese],
            ['Tipo storage','IndexedDB'],
            ['Connessione richiesta','Nessuna ✓']
          ].map(([l,v])=>(
            <div key={l} className="riga-info">
              <span>{l}</span>
              <span className={`val-info${l==='Connessione richiesta'?' text-green':''}`}>{v}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="sez-hdr"><IconPhone/><h3>Backup & Ripristino</h3></div>
        <p className="sez-desc">
          Esporta un file JSON con tutte le spese per cambiare dispositivo o conservarne una copia sicura.
        </p>
        <div className="avviso">
          <IconWarn/>
          <span>L'importazione sovrascriverà tutte le spese esistenti!</span>
        </div>
        <div className="bottoni-bk">
          <button className="btn-bk exp" onClick={handleExp}>
            <IconDown/>
            <div>
              <span className="bk-tit">Esporta Dati</span>
              <span className="bk-desc">Scarica file JSON di backup</span>
            </div>
          </button>
          <button className="btn-bk imp" onClick={()=>fileRef.current?.click()} disabled={importing}>
            <IconUp/>
            <div>
              <span className="bk-tit">{importing?'Importazione...':'Importa Dati'}</span>
              <span className="bk-desc">Ripristina da file JSON</span>
            </div>
          </button>
          <input ref={fileRef} type="file" accept=".json" onChange={handleImp} style={{display:'none'}}/>
        </div>
      </div>

      <div className="card card-app-info">
        <p className="app-nome-info">💰 SpesaTracker</p>
        <p className="app-ver">Versione 1.0.0</p>
        <p className="app-nota">App PWA · Installabile · Offline-first · 100% Privata</p>
      </div>
    </div>
  );
}

/* ===== APP ROOT ===== */
function App(){
  const {spese,speseDelMese,totale,loading,mese,setMese,aggiungi,elimina,esporta,importa}=useSpese();
  const [tab,setTab]=useState('home');

  if(loading) return(
    <div className="loading">
      <div className="spinner"/>
      <p>Caricamento SpesaTracker...</p>
    </div>
  );

  const nav=[
    {id:'home',Icon:IconHome,label:'Home'},
    {id:'stats',Icon:IconChart,label:'Stats'},
    {id:'storico',Icon:IconList,label:'Storico'},
    {id:'config',Icon:IconSettings,label:'Config'},
  ];

  return(
    <div className="app">
      <div className="contenuto">
        {tab==='home'&&<Dashboard speseDelMese={speseDelMese} totale={totale}
          mese={mese} setMese={setMese} aggiungi={aggiungi}/>}
        {tab==='stats'&&<Statistiche speseDelMese={speseDelMese} mese={mese}/>}
        {tab==='storico'&&<Storico spese={spese} elimina={elimina}/>}
        {tab==='config'&&<Impostazioni esporta={esporta} importa={importa} totSpese={spese.length}/>}
      </div>
      <nav className="bottom-nav">
        {nav.map(({id,Icon,label})=>(
          <button key={id} className={`nav-btn${tab===id?' attivo':''}`} onClick={()=>setTab(id)}>
            <Icon/>
            <span>{label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
